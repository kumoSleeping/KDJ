[package]
name = "kumodeck-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.22"
cbc = "0.1"
ecb = { version = "0.1", features = ["alloc"] }
flate2 = "1.1.9"
futures-util = "0.3.33"
hex = "0.4.3"
image = "0.25"
kumodeck-core = { version = "0.2.0", path = "../kumodeck-core" }
lofty = "0.24.0"
md-5 = "0.10"
num-bigint = "0.4"
percent-encoding = "2.3.2"
qrcode = "0.14.1"
rand = "0.8"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "charset", "http2", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"
