[package]
name = "kdj-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
futures-util = "0.3.33"
kdj-analysis = { version = "0.2.12", path = "../kdj-analysis" }
kdj-core = { version = "0.2.12", path = "../kdj-core" }
kdj-library = { version = "0.2.12", path = "../kdj-library" }
kdj-providers = { version = "0.2.12", path = "../kdj-providers" }
rand = "0.10.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "signal"] }
# "io" = ReaderStream，音频端点要靠它边读边发，不能整份读进内存
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
