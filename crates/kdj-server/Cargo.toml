[package]
name = "kdj-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = "0.4.45"
futures-util = "0.3.33"
kdj-analysis = { version = "1.0.0-rc1", path = "../kdj-analysis" }
kdj-core = { version = "1.0.0-rc1", path = "../kdj-core", features = ["rustls-ring"] }
kdj-library = { version = "1.0.0-rc1", path = "../kdj-library" }
kdj-providers = { version = "1.0.0-rc1", path = "../kdj-providers" }
rand = "0.10.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "signal"] }
# "io" = ReaderStream，音频端点要靠它边读边发，不能整份读进内存
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify = "8.2.0"
sysinfo = "0.37"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
