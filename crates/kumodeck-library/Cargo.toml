[package]
name = "kumodeck-library"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
kumodeck-analysis = { version = "0.2.0", path = "../kumodeck-analysis" }
kumodeck-core = { version = "0.2.0", path = "../kumodeck-core" }
kumodeck-providers = { version = "0.2.0", path = "../kumodeck-providers" }
lofty = "0.24.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"
walkdir = "2.5.0"
