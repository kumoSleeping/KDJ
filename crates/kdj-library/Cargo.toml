[package]
name = "kdj-library"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
kdj-analysis = { version = "0.2.42", path = "../kdj-analysis" }
kdj-core = { version = "0.2.42", path = "../kdj-core" }
kdj-providers = { version = "0.2.42", path = "../kdj-providers" }
lofty = "0.24.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.28"
# 桌面端的 OneLibrary 写入器会把同一版 libsqlite3-sys 切到 SQLCipher；这里不能在
# 所有桌面平台无条件打开普通 bundled SQLite。Windows runner 没有 sqlite3.lib，
# 因此与移动端一样显式启用 bundled；Labs 的 bundled-sqlcipher 特性会统一覆盖它。
# macOS/Linux 继续使用系统 SQLite，避免稳定版无谓编译 SQLCipher。
rusqlite = "0.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"
walkdir = "2.5.0"

# 删除曲目走系统回收站用。安卓/iOS 没有系统回收站（各家「最近删除」是
# 应用私有的，没有统一 API），这个 crate 也不支持——干脆不编进去，
# service::move_to_trash 在那两个平台上编成一个报错的桩。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"

[target.'cfg(any(target_os = "windows", target_os = "android", target_os = "ios"))'.dependencies]
rusqlite = { version = "0.35", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }
