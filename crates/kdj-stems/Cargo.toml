[package]
name = "kdj-stems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
cc = "=1.4.0"

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
kdj-analysis = { version = "0.2.41", path = "../kdj-analysis" }
kdj-core = { version = "0.2.41", path = "../kdj-core" }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
symphonia = { version = "0.5.5", features = ["aac", "alac", "mp3", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm"] }
tracing = "0.1.44"

# macOS uses the locked ByteDance model through the safe ONNX Runtime CPU path.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "api-27",
    "download-binaries",
    "copy-dylibs",
    "coreml",
    "tls-rustls",
] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "api-27",
    "download-binaries",
    "copy-dylibs",
    "directml",
    "tls-rustls",
] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "api-27",
    "download-binaries",
    "copy-dylibs",
    "nnapi",
    "tls-rustls",
] }
