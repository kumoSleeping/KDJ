[package]
name = "kdj-stems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
kdj-analysis = { version = "0.2.41", path = "../kdj-analysis" }
kdj-core = { version = "0.2.41", path = "../kdj-core" }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
symphonia = { version = "0.5.5", features = ["aac", "alac", "mp3", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm"] }
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
