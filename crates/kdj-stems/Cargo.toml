[package]
name = "kdj-stems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
cc = { version = "=1.4.0", optional = true }

[features]
default = []
# Disabled preservation boundary. Delete this feature and the `*_ai.rs`, Core ML/ONNX/model files
# once the classical path has completed its evaluation period.
ai-stem-legacy = ["dep:cc", "dep:ort", "dep:reqwest", "dep:zip"]
stem-debug-onnx = ["ai-stem-legacy"]

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
kdj-analysis = { version = "0.2.41", path = "../kdj-analysis" }
kdj-core = { version = "0.2.41", path = "../kdj-core" }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
symphonia = { version = "0.5.5", features = ["aac", "alac", "mp3", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm"] }
thiserror = "2.0.19"
tracing = "0.1.44"
zip = { version = "4.6.1", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }

# ORT exists only behind `ai-stem-legacy`; default builds do not resolve or link its runtime.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "api-27",
    "download-binaries",
    "copy-dylibs",
    "tls-rustls",
] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "api-27",
    "download-binaries",
    "copy-dylibs",
    "directml",
    "tls-rustls",
] }
