[package]
name = "kdj-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.22"
# 预览流转发：不让 server 层依赖 reqwest 的类型，字节流用裸 Bytes 传出去
bytes = "1"
cbc = "0.1"
ecb = { version = "0.1", features = ["alloc"] }
flate2 = "1.1.9"
futures-util = "0.3.33"
hex = "0.4.3"
# default features 会把 AVIF 编码器（rav1e）、OpenEXR、TIFF 全编进来，
# 一次都没用到却占 597KB（实测，见 docs/rust-port/06-packaging-results.md §3）。
# webp/gif/bmp 必须留：load_from_memory 靠嗅探魔数选解码器，
# 四家平台的封面 CDN 就在发 webp，砍掉的表现是"某些歌没封面"、只在真机暴露。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
kdj-core = { version = "0.2.41", path = "../kdj-core" }
lofty = "0.24.0"
md-5 = "0.10"
num-bigint = "0.4"
percent-encoding = "2.3.2"
qrcode = "0.14.1"
rand = "0.8"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "charset", "http2", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "process"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"
