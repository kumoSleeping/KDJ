[package]
name = "kdj-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.22"
# 预览流转发：不让 server 层依赖 reqwest 的类型，字节流用裸 Bytes 传出去
bytes = "1"
# 登录 Cookie 的轮换：解析平台响应里的 Set-Cookie（reqwest 已经带进来同一个版本）。
cookie = "0.18"
cbc = "0.1"
ecb = { version = "0.1", features = ["alloc"] }
flate2 = "1.1.9"
futures-util = "0.3.33"
hex = "0.4.3"
hls-transmux = { version = "=0.2.1", default-features = false }
kdj-media = { version = "1.1.0-rc20", path = "../kdj-media" }
# 受控媒体请求判断系统代理是否对本跳生效，与 reqwest 读代理用的是同一个匹配器。
http = "1"
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-proxy"] }
# default features 会把 AVIF 编码器（rav1e）、OpenEXR、TIFF 全编进来，
# 一次都没用到却占 597KB（实测，见 docs/rust-port/06-packaging-results.md §3）。
# webp/gif/bmp 必须留：load_from_memory 靠嗅探魔数选解码器，
# 四家平台的封面 CDN 就在发 webp，砍掉的表现是"某些歌没封面"、只在真机暴露。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
kdj-core = { version = "1.1.0-rc20", path = "../kdj-core", features = ["rustls-ring"] }
lofty = "0.24.0"
libc = "0.2"
md-5 = "0.10"
num-bigint = "0.4"
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
rand = "0.8"
regex = "1.13.1"
# 检查更新：比较 GitHub tag 与本机版本（含 rcN 预发布号）。
semver = "1"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream", "gzip", "charset", "http2", "cookies", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "process"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rookie = { version = "0.5.6", path = "../../vendor/rookie" }
rust-ini = "0.21"
# GUI launches do not inherit shell proxy variables. Honor desktop OS proxies
# for provider/tool downloads and for guarded media when a proxy covers the host;
# loopback clients opt out explicitly.
reqwest = { version = "=0.13.4", default-features = false, features = ["system-proxy"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-proxy", "client-proxy-system"] }
tempfile = "3.27"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
# rookie 读取浏览器 SQLite。单独测试 providers 时也要自带 SQLite，
# 不能依赖应用的 kdj-library 恰好启用 bundled 或 runner 安装 sqlite3.lib。
rusqlite = { version = "0.35", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSString", "NSURL"] }

[dev-dependencies]
rusqlite = { version = "0.35", features = ["bundled"] }
