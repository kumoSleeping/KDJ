[package]
name = "kdj-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "KDJ 桌面壳：把 axum server 编进 Tauri 进程内"

[lib]
# 安卓/iOS 的入口是系统通过 JNI/静态链接去加载库，没有 main()，
# 所以逻辑全放 lib、main.rs 只转调一行。桌面和移动端因此共用同一份 run()。
name = "kdj_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
anyhow = "1.0.104"
kdj-core = { version = "0.2.1", path = "../crates/kdj-core" }
kdj-server = { version = "0.2.1", path = "../crates/kdj-server" }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
# tauri.conf.json 里一有 `plugins` 段，`generate_context!` 展开出来的代码就会
# 直接引用 ::serde_json 反序列化插件配置——不显式依赖它，报的是
# "could not find serde_json in the list of imported crates"，
# 看着完全不像是"加了个 updater 配置"引起的。
serde_json = "1.0"
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# 一键更新：updater 下载+minisign 校验+原地替换，process 提供替换后的自重启。
# 只在桌面有意义（安卓走 Release 页下 APK），target 限定住免得安卓交叉编译多拖依赖。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# `tauri build` 会自动带上这个 feature，`generate_context!` 才会去读
# frontendDist 把前端产物嵌进二进制；不带的时候（`cargo build` / `tauri dev`）
# 走 devUrl。**不要删**：删了之后光 `cargo build` 就会因为找不到 dist-tauri/ 而失败。
custom-protocol = ["tauri/custom-protocol"]
