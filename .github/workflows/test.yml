# 【已归档 2026-07-27】v0.1.x 的 pytest + 前端验证线。sidecar/ 只剩参照物身份，
# main 的 CI 由 rust-build.yml 负责（cargo test + tsc + 三平台打包）。
# 每次 push / PR 的快速验证：三平台 pytest + 前端 tsc/构建，不打安装包。
# 打包（DMG/EXE/AppImage）在 build.yml，由 v* tag 触发。
name: test

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 前端类型检查与构建
        run: |
          npm ci
          npm run build

      - name: 后端测试
        shell: bash
        # annotate-failures 插件把每个失败测试变成 check-run annotation——
        # 这是匿名可读的 API，远程排查不用登录拿完整日志
        run: |
          python -m pip install -U pip
          python -m pip install "./sidecar[dev]" pytest-github-actions-annotate-failures
          python -m pytest sidecar/tests -q --tb=short
