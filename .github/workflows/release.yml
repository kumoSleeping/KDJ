# 自动发行：推送 main 时检测版本号，出现新版本就打 tag + 建 Release，
# 再把两条打包线（桌面 rust-build.yml / 安卓 rust-android.yml）调度到 tag 上跑。
#
# 版本号以 **src-tauri/tauri.conf.json 的 .version** 为发版入口，但
# package.json / Cargo.toml 必须同步：Tauri 安装包读前者，内置 Rust health/update
# 读 Cargo 版本。gate 会校验三处一致，避免 UI 和安装包各报一个版本。
#
# 发版流程（人只做第一步）：
#   1. 同步修改 tauri.conf.json / package.json / Cargo.toml 的版本，提交、推 main；
#   2. 本工作流发现 v{version} 这个 tag 还不存在 → 打 tag、建 Release（自动生成 notes）；
#   3. dispatch 两条打包线到 refs/tags/v{version} 上——它们各自的
#      「发布 Release（仅 tag）」步骤会把产物传进同一个 Release。
#
# 为什么不是"打了 tag 自动触发打包"而要显式 dispatch：
# 用 GITHUB_TOKEN push 的 tag **不会**触发任何 on:tags 工作流
# （GitHub 防工作流递归的硬规则），静默得像一切正常。手动打 tag 推上来
# 那条老路仍然通（tag 事件会直接触发两条打包线，本工作流不掺和）。
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 打 tag + 建 Release
  actions: write # dispatch 两条打包线

# 排队而不是取消：两次连续推送要是都带版本号变更，各自都该发出去
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.probe.outputs.version }}
      new: ${{ steps.probe.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验三处版本号一致
        run: |
          set -euo pipefail
          tauri=$(jq -r '.version' src-tauri/tauri.conf.json)
          npm=$(jq -r '.version' package.json)
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if [ "$tauri" != "$npm" ] || [ "$tauri" != "$cargo" ]; then
            echo "::error::版本号不一致：tauri=$tauri package.json=$npm Cargo.toml=$cargo"
            exit 1
          fi

      - name: 检测版本号是否已发行
        id: probe
        run: |
          set -euo pipefail
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 形状不对宁可不发也别打出 v null 这种 tag
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tauri.conf.json 里的 version 不像语义化版本：$version"
            exit 1
          fi
          # 问远端而不是本地：checkout 默认浅克隆不带 tags，本地查永远是"没有"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version 已存在，本次推送不发行"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "发现新版本 v$version"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  cut:
    needs: gate
    if: needs.gate.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 正式发行密钥门禁
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少正式发行 GitHub Secret：$name；不创建 tag/空 Release"
              exit 1
            fi
          done

      - name: 打 tag 并建 Release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "KDJ v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

          # 新 Release 一公开，releases/latest 就会立刻从上一版切到这个尚无产物的
          # 空壳；桌面 updater 随即请求 /latest/download/latest.json 并收到 404。
          # 先把上一版完整清单留作占位：构建期间旧客户端只会得到「已是最新」，
          # 等 rust-build 的 latest-json job 汇齐三平台后再用新清单原子覆盖。
          previous_tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          mkdir -p previous-release
          if [ -n "$previous_tag" ]; then
            gh release download "$previous_tag" --pattern latest.json --dir previous-release 2>/dev/null || true
          fi

          # Release 先建好（产物晚点由打包线传进来）。下载说明放在自动生成的
          # 变更记录前面，文件名必须与 rust-build / rust-android 的产物保持一致。
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          {
            echo "## 下载"
            echo
            echo "请根据系统选择安装包："
            echo
            echo "### Windows"
            echo "- **Windows 10/11 64 位（推荐）**：[下载 EXE 安装程序]($base_url/KDJ_${VERSION}_x64-setup.exe)"
            echo "- **Windows 10/11 64 位（企业或批量部署）**：[下载 MSI 安装程序]($base_url/KDJ_${VERSION}_x64_en-US.msi)"
            echo
            echo "### macOS"
            echo "- **Apple Silicon 与 Intel Mac 通用**：[下载 DMG 安装包]($base_url/KDJ_${VERSION}_universal.dmg)"
            echo
            echo "### Linux（x86_64）"
            echo "- **Ubuntu / Debian**：[下载 DEB 安装包]($base_url/KDJ_${VERSION}_amd64.deb)"
            echo "- **Fedora / RHEL / openSUSE**：[下载 RPM 安装包]($base_url/KDJ-${VERSION}-1.x86_64.rpm)"
            echo "- **其他发行版**：[下载 AppImage]($base_url/KDJ_${VERSION}_amd64.AppImage)"
            echo
            echo "### Android"
            echo "- **ARM 32/64 位设备**：[下载 APK]($base_url/app-universal-release.apk)"
            echo
            echo "> .sig、.app.tar.gz 和 latest.json 是自动更新所需文件，普通用户无需下载。"
          } > release-notes.md

          gh release create "v$VERSION" \
            --title "KDJ v$VERSION" \
            --generate-notes \
            --notes-file release-notes.md
          if [ -f previous-release/latest.json ]; then
            gh release upload "v$VERSION" previous-release/latest.json --clobber
          fi

      - name: 调度打包线到 tag 上
        run: |
          set -euo pipefail
          # --ref 指到 tag，两条线里的 github.ref 就是 refs/tags/v$VERSION，
          # 它们各自"仅 tag 才发布"的条件因此成立，产物会传进上面那个 Release
          gh workflow run rust-build.yml --ref "v$VERSION"
          gh workflow run rust-android.yml --ref "v$VERSION"
          echo "已调度桌面 + 安卓打包，进度看 Actions 页"
