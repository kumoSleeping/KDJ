# 纯 Rust + Tauri 的桌面三平台打包（macOS / Windows / Linux）。
# 2026-07-27 起这是 main 的**正式**流水线（rust-rewrite 已扶正并入 main）；
# v0.1.0 的 Electron 线（build.yml / test.yml）已归档成 workflow_dispatch-only。
#
# 触发：
#   - push 到 main：跑测试 + 打包，产物只当 artifact；
#   - tag `v*`：额外发 GitHub Release。tag 的正常来源是 release.yml——
#     它盯着 src-tauri/tauri.conf.json 的 version，出现没发行过的版本号
#     就自动打 tag 建 Release 再 dispatch 本工作流到 tag ref 上。
#     手动 push tag 也照常触发，两条路殊途同归。
name: rust-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 发 Release 需要写权限。默认的 GITHUB_TOKEN 是只读的——v0.1.0 首跑三平台
# 包全打出来了、栽在最后一步上传，就是漏了这三行（见 docs/05-tabs-git-and-ci.md）。
permissions:
  contents: write

# 同一分支上连续 push 时取消上一次：release 档 LTO + codegen-units=1 很慢，
# 排队会把 runner 全占住。tag 的构建不能取消，所以 group 里带上 ref。
concurrency:
  group: rust-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runner 现在是 Apple Silicon。打 universal 二进制一次覆盖
          # arm64 + x64（v0.1.0 是两个 DMG，Tauri 这边合成一个），
          # 代价是要装两个 rust target 并编译两遍。
          - os: macos-latest
            label: macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
          - os: ubuntu-latest
            label: linux-x86_64
            rust_targets: ""
            tauri_args: ""
          - os: windows-latest
            label: windows-x86_64
            rust_targets: ""
            tauri_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # 缓存 target/ 与 ~/.cargo。symphonia + rustfft + rusqlite(bundled) 冷编
      # 十几分钟，缓存命中后只重编本仓库的 5 个 crate。
      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Windows runner 的 Git Bash 自带一个精简 Perl，缺
      # Locale::Maketext::Simple，而且启动 bash 时会把 /usr/bin 强行放回 PATH
      # 最前。不要和 PATH 顺序较劲：openssl-src 原生支持 OPENSSL_SRC_PERL，
      # 直接钉住完整 Strawberry Perl 的绝对路径。
      - name: 配置 Windows OpenSSL 构建环境
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlDir = 'C:\Strawberry\perl\bin'
          $perlExe = Join-Path $perlDir 'perl.exe'
          if (-not (Test-Path $perlExe)) {
            choco install strawberryperl --yes --no-progress --limit-output
          }
          if (-not (Test-Path $perlExe)) {
            throw "找不到完整的 Strawberry Perl：$perlExe"
          }
          & $perlExe -MLocale::Maketext::Simple -e 'print qq(perl-ok\n)'
          "OPENSSL_SRC_PERL=$perlExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Tauri 在 Linux 上是壳，真正渲染的是系统 WebKitGTK，所以这些 -dev 包
      # 是**编译期**依赖，缺一个就是 pkg-config 报错而不是运行期白屏。
      #   libwebkit2gtk-4.1-dev  Tauri 2 用 4.1（Tauri 1 才是 4.0），
      #                          会连带拖进 libsoup-3.0 / libjavascriptcoregtk-4.1
      #   librsvg2-dev           托盘/图标的 SVG 渲染
      #   patchelf               打 AppImage 时改 rpath
      #   libxdo-dev             tauri-plugin 的全局快捷键/输入模拟
      #   appindicator           托盘。Ubuntu 24.04 起 libappindicator3-dev 已被
      #                          libayatana-appindicator3-dev 取代，装错名字会
      #                          "E: Unable to locate package"——所以两个名字都试。
      #   libasound2-dev         kdj-player 原生播放走 cpal/ALSA，v0.2.10 缺了它
      #                          整轮 Linux 构建挂掉、latest.json 永远停在占位旧版
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libasound2-dev
          sudo apt-get install -y libayatana-appindicator3-dev \
            || sudo apt-get install -y libappindicator3-dev

      # 注意：**不要**给 cargo 接 `| head -N` 之类的管道，读端提前关闭会给
      # cargo 发 SIGPIPE 把编译打断，看起来像随机失败。
      # 只跑 debug：release 档开了 lto + codegen-units=1，跑测试等于白等十分钟。
      # 真库集成测试（tests/real_library.rs）靠 KDJ_TEST_DB 环境变量开关，
      # CI 上没有这个变量，会自己跳过。
      #
      # 测试与打包解耦：continue-on-error 让后续步骤能看到 outcome。
      # main 分支仍硬失败（见下一 step）；正式 tag 允许测试红了也继续打包——
      # 否则一个 Windows 时序/权限 flaky 测试会卡死全平台更新通道。
      - name: Rust 全量测试
        id: rust_test
        continue-on-error: true
        run: cargo test --workspace

      - name: 分支构建要求测试通过
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.rust_test.outcome == 'failure' }}
        run: |
          echo "::error::main 分支构建要求 cargo test 通过"
          exit 1

      - name: 正式 tag 测试失败仅告警
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.rust_test.outcome == 'failure' }}
        run: |
          echo "::warning::tag 构建上 cargo test 失败，仍继续打包以便更新通道不因单测卡死；请尽快修测试。"

      - name: 安装前端依赖
        run: npm ci

      - name: 前端类型检查
        run: npm run typecheck

      # M7（Tauri 壳）落地之前 src-tauri/ 还不完整。这里探测一下而不是硬跑，
      # 让这条流水线在壳做好之前仍然能当"三平台 Rust 测试"用，红叉只留给真问题。
      # 判据是 tauri.conf.json 而不是目录是否存在：壳在半成品状态下（只有
      # icons/ 和 src/、还没写配置）目录就已经在了，按目录判会误触发打包。
      - name: 探测 Tauri 壳
        id: shell
        shell: bash
        run: |
          if [ -f src-tauri/tauri.conf.json ] && [ -f src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::src-tauri/tauri.conf.json 还不存在（M7 未完成），本次跳过打包，只跑测试。"
          fi

      # 脚本名以 package.json 为准：有 tauri:build 就用它（能带上项目自己的
      # 前置步骤），没有就直接调 CLI。`npx tauri` 会去装 npm 上那个 v1 时代的
      # 同名废弃包，所以必须写全 `@tauri-apps/cli@^2`。
      #
      # Windows 首次打 NSIS 时还会从 GitHub 下载工具包，偶发的 CDN 断连会在
      # 应用、MSI 都已编好后报 `io: Peer disconnected`。Windows runner 对整个
      # Tauri 打包最多重试两次；Cargo 增量产物仍在，重试主要补齐 bundler 下载，
      # 永久性编译/配置错误则会在三次都失败后照常打红。其他平台不额外重跑。
      - name: Tauri 打包
        if: steps.shell.outputs.present == 'true'
        shell: bash
        env:
          # macOS 上 Tauri 默认会找钥匙串里的签名证书；和 v0.1.0 一样不签名，
          # 用户首次打开要右键 → 打开。
          APPLE_SIGNING_IDENTITY: "-"
          CI: "true"
          # 一键更新的 minisign 私钥（见 docs/rust-port/08 §密钥）。
          # 分支构建没配 secret 时摘掉 createUpdaterArtifacts，只做普通包验证；
          # 正式 tag 缺密钥必须失败，不能发布一个更新链断掉的版本。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::正式发行缺少 TAURI_SIGNING_PRIVATE_KEY；拒绝发布一个后续无法一键升级的版本"
              exit 1
            fi
            echo "::warning::分支构建没有 TAURI_SIGNING_PRIVATE_KEY，本次只验证普通安装包"
            jq 'del(.bundle.createUpdaterArtifacts)' src-tauri/tauri.conf.json > /tmp/conf.json
            mv /tmp/conf.json src-tauri/tauri.conf.json
          fi
          run_tauri_build() {
            if node -e "process.exit((require('./package.json').scripts||{})['tauri:build']?0:1)"; then
              npm run tauri:build -- ${{ matrix.tauri_args }}
            else
              npx --yes @tauri-apps/cli@^2 build ${{ matrix.tauri_args }}
            fi
          }

          max_attempts=1
          [[ "${RUNNER_OS:-}" == "Windows" ]] && max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if run_tauri_build; then
              break
            else
              status=$?
            fi
            if (( attempt == max_attempts )); then
              echo "::error::Tauri 打包连续 ${max_attempts} 次失败（最后退出码：${status}）"
              exit "$status"
            fi
            echo "::warning::Windows Tauri 打包失败（退出码：${status}），20 秒后进行第 $((attempt + 1))/${max_attempts} 次尝试"
            sleep 20
          done

      # 产物路径用宽松的 `**` 通配：src-tauri 是不是 workspace 成员会决定
      # 产物落在 `target/` 还是 `src-tauri/target/`，加上 --target 又会多一层
      # 三元组目录。与其猜，不如让 glob 兜住所有情况。
      #
      # 本机实测（不带 --target 时）落点是根 `target/release/bundle/`：
      #   bundle/macos/KDJ.app  和  bundle/dmg/KDJ_0.2.0_aarch64.dmg
      # 也就是 src-tauri 作为 workspace 成员那一支。带 --target universal-apple-darwin
      # 时会变成 target/universal-apple-darwin/release/bundle/，通配仍然兜得住。
      # *.tar.gz / *.sig / setup.exe 的 sig 是 updater 的更新包与签名，
      # latest-json 那个 job 和终端用户都要从 Release 上取，一并上传
      - name: 上传产物
        if: steps.shell.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kdj-rust-${{ matrix.label }}
          path: |
            **/release/bundle/dmg/*.dmg
            **/release/bundle/macos/*.app.tar.gz
            **/release/bundle/macos/*.app.tar.gz.sig
            **/release/bundle/nsis/*.exe
            **/release/bundle/nsis/*.exe.sig
            **/release/bundle/msi/*.msi
            **/release/bundle/msi/*.msi.sig
            **/release/bundle/appimage/*.AppImage
            **/release/bundle/appimage/*.AppImage.sig
            **/release/bundle/deb/*.deb
            **/release/bundle/deb/*.deb.sig
            **/release/bundle/rpm/*.rpm
            **/release/bundle/rpm/*.rpm.sig
          if-no-files-found: error

      - name: 发布 Release（仅 tag）
        if: steps.shell.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 默认 make_latest=true 会在第一个平台传包时就抢 Latest，
          # 此时 latest.json 还没写好。提升权只留给下面的 latest-json job。
          make_latest: false
          files: |
            **/release/bundle/dmg/*.dmg
            **/release/bundle/macos/*.app.tar.gz
            **/release/bundle/macos/*.app.tar.gz.sig
            **/release/bundle/nsis/*.exe
            **/release/bundle/nsis/*.exe.sig
            **/release/bundle/msi/*.msi
            **/release/bundle/msi/*.msi.sig
            **/release/bundle/appimage/*.AppImage
            **/release/bundle/appimage/*.AppImage.sig
            **/release/bundle/deb/*.deb
            **/release/bundle/deb/*.deb.sig
            **/release/bundle/rpm/*.rpm
            **/release/bundle/rpm/*.rpm.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 一键更新的"版本清单"。updater 拉 releases/latest/download/latest.json。
  # 旧规则是三平台全绿才写清单；任一平台挂掉就 skip，再叠加「新 Release
  # 立刻变 Latest + 旧清单占位」，客户端会静默冻结在旧 version。
  # 新规则：
  #   1. 有任意成功平台的 artifact 就拼清单（缺的平台只 warning，不堵死别人）；
  #   2. 至少一个平台成功才上传，并 gh release edit --latest 提升本版；
  #   3. 全部失败则不上传、不提升，上一版继续当 Latest。
  latest-json:
    name: 更新清单 latest.json
    needs: desktop
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.desktop.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载已有平台产物
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: 拼 latest.json、上传并提升 Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          if [ "$DOWNLOAD_OUTCOME" != "success" ]; then
            echo "::error::没有任何桌面构建产物可下载；拒绝写入 latest.json，也不提升 Latest"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, glob, sys
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag.lstrip("v")

          def find(pattern):
              hits = sorted(glob.glob(f"bundles/**/{pattern}", recursive=True))
              # 只要正式包，跳过误匹配到的 .sig
              hits = [h for h in hits if not h.endswith(".sig")]
              return hits[0] if hits else None

          def entry(art):
              sig = art + ".sig"
              if not os.path.exists(sig):
                  raise SystemExit(f"::error::{os.path.basename(art)} 缺少签名：{sig}")
              name = os.path.basename(art)
              return {
                  "signature": open(sig).read().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              }

          platforms = {}
          missing = []

          mac = find("*.app.tar.gz")
          if mac:
              mac_entry = entry(mac)
              # universal 一个包喂两个架构；-app 是 updater 2.10+ 精确键，
              # 无后缀键留给已装出去的旧 updater。
              for arch in ("aarch64", "x86_64"):
                  platforms[f"darwin-{arch}-app"] = mac_entry
                  platforms[f"darwin-{arch}"] = mac_entry
          else:
              missing.append("macOS")

          nsis = find("*-setup.exe")
          msi = find("*.msi")
          if nsis:
              nsis_entry = entry(nsis)
              platforms["windows-x86_64-nsis"] = nsis_entry
              platforms["windows-x86_64"] = nsis_entry
          if msi:
              platforms["windows-x86_64-msi"] = entry(msi)
          if not nsis and not msi:
              missing.append("Windows")

          appimage = find("*.AppImage")
          deb = find("*.deb")
          rpm = find("*.rpm")
          if appimage:
              appimage_entry = entry(appimage)
              platforms["linux-x86_64-appimage"] = appimage_entry
              platforms["linux-x86_64"] = appimage_entry
          if deb:
              platforms["linux-x86_64-deb"] = entry(deb)
          if rpm:
              platforms["linux-x86_64-rpm"] = entry(rpm)
          if not appimage and not deb and not rpm:
              missing.append("Linux")

          for name in missing:
              print(f"::warning::本版缺少 {name} 更新包，latest.json 不含该平台；其它平台仍可更新")

          if not platforms:
              raise SystemExit(
                  "::error::没有任何平台更新包，拒绝写入 latest.json，也不提升 Latest；"
                  "上一版继续作为更新通道"
              )

          manifest = {
              "version": version,
              "notes": f"KDJ {tag}",
              "pub_date": datetime.now(timezone.utc).isoformat(),
              "platforms": platforms,
          }
          with open("latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2)[:1200])
          if missing:
              print(f"partial platforms; missing={','.join(missing)}", file=sys.stderr)
          else:
              print("all desktop platform families present", file=sys.stderr)
          PY

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          # 清单就绪后才抢 Latest；此前 release.yml 用 --latest=false 建的空壳
          # 不会让 /releases/latest/download/latest.json 指向残缺发版。
          gh release edit "$TAG" --repo "$REPO" --latest
          served=$(python3 -c "import json;print(json.load(open('latest.json'))['version'])")
          echo "已上传 latest.json 并提升 $TAG 为 Latest（version=$served）"
