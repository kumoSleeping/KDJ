# 纯 Rust + Tauri 的桌面三平台打包（macOS / Windows / Linux）。
# 2026-07-27 起这是 main 的**正式**流水线（rust-rewrite 已扶正并入 main）；
# 旧 Electron 构建与测试工作流已删除；桌面端只保留这一条正式流水线。
#
# 触发：
#   - push 到 main：跑测试 + 打包，产物只当 artifact；
#   - tag `v*`：额外发 GitHub Release。tag 的正常来源是 release.yml——
#     它盯着 src-tauri/tauri.conf.json 的 version，出现没发行过的版本号
#     就自动打 tag 建 Release 再 dispatch 本工作流到 tag ref 上。
#     手动 push tag 也照常触发，两条路殊途同归。
name: rust-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 测试、签名、打包 job 默认只读；只有独立 publish/latest-json job 临时获得 contents:write。
permissions:
  contents: read

# 同一分支上连续 push 时取消上一次：release 档 LTO + codegen-units=1 很慢，
# 排队会把 runner 全占住。tag 的构建不能取消，所以 group 里带上 ref。
concurrency:
  group: rust-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: 发布前安全与前端门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust 审计缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: security-audit

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: npm 依赖漏洞门禁
        run: |
          npm audit --audit-level=low
          npm audit signatures

      - name: 前端逻辑测试
        run: npm run test:frontend-logic

      - name: 前端生产构建
        run: npm run tauri:web:build

      - name: Cargo 依赖漏洞门禁
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2
          # RUSTSEC-2024-0429 已在 vendor/glib-0.18.5 逐行回补上游 0.20 修复；
          # path source 会被 cargo-audit 正确排除，不设置 ignore，任何普通漏洞仍硬失败。
          cargo audit

  desktop:
    name: ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 分架构编译。updater 根据当前进程的
          # target_arch 请求 darwin-aarch64 / darwin-x86_64，不再下载
          # 大一倍的 universal 包。旧 universal 安装也能按实际 slice 平滑迁移。
          - os: macos-latest
            label: macos-arm64
            rust_targets: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
            mac_arch: aarch64
          # GitHub 当前的 macos-latest 是 Apple Silicon；Intel 使用官方保留到
          # 2027-08 的原生 x86_64 runner，避免在 ARM runner 上交叉编译 Swift/原生插件。
          - os: macos-15-intel
            label: macos-x86_64
            rust_targets: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
            mac_arch: x86_64
          - os: ubuntu-latest
            label: linux-x86_64
            rust_targets: ""
            tauri_args: ""
          - os: windows-latest
            label: windows-x86_64
            rust_targets: ""
            tauri_args: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_targets }}

      # 缓存 target/ 与 ~/.cargo。symphonia + rustfft + rusqlite(bundled) 冷编
      # 十几分钟，缓存命中后只重编本仓库的 5 个 crate。
      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.label }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Windows runner 的 Git Bash 自带一个精简 Perl，缺
      # Locale::Maketext::Simple，而且启动 bash 时会把 /usr/bin 强行放回 PATH
      # 最前。不要和 PATH 顺序较劲：openssl-src 原生支持 OPENSSL_SRC_PERL，
      # 直接钉住完整 Strawberry Perl 的绝对路径。
      - name: 配置 Windows OpenSSL 构建环境
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlDir = 'C:\Strawberry\perl\bin'
          $perlExe = Join-Path $perlDir 'perl.exe'
          if (-not (Test-Path $perlExe)) {
            choco install strawberryperl --yes --no-progress --limit-output
          }
          if (-not (Test-Path $perlExe)) {
            throw "找不到完整的 Strawberry Perl：$perlExe"
          }
          & $perlExe -MLocale::Maketext::Simple -e 'print qq(perl-ok\n)'
          "OPENSSL_SRC_PERL=$perlExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Tauri 在 Linux 上是壳，真正渲染的是系统 WebKitGTK，所以这些 -dev 包
      # 是**编译期**依赖，缺一个就是 pkg-config 报错而不是运行期白屏。
      #   libwebkit2gtk-4.1-dev  Tauri 2 用 4.1（Tauri 1 才是 4.0），
      #                          会连带拖进 libsoup-3.0 / libjavascriptcoregtk-4.1
      #   librsvg2-dev           托盘/图标的 SVG 渲染
      #   patchelf               打 AppImage 时改 rpath
      #   libxdo-dev             tauri-plugin 的全局快捷键/输入模拟
      #   appindicator           托盘。Ubuntu 24.04 起 libappindicator3-dev 已被
      #                          libayatana-appindicator3-dev 取代，装错名字会
      #                          "E: Unable to locate package"——所以两个名字都试。
      #   libasound2-dev         kdj-player 原生播放走 cpal/ALSA，v0.2.10 缺了它
      #                          整轮 Linux 构建挂掉、latest.json 永远停在占位旧版
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libasound2-dev
          sudo apt-get install -y libayatana-appindicator3-dev \
            || sudo apt-get install -y libappindicator3-dev

      # 注意：**不要**给 cargo 接 `| head -N` 之类的管道，读端提前关闭会给
      # cargo 发 SIGPIPE 把编译打断，看起来像随机失败。
      # 只跑 debug：release 档开了 lto + codegen-units=1，跑测试等于白等十分钟。
      # 真库集成测试（tests/real_library.rs）靠 KDJ_TEST_DB 环境变量开关，
      # CI 上没有这个变量，会自己跳过。
      #
      # tag 与 main 使用同一硬门禁。任一平台的单元/集成测试失败都会停止该平台，
      # 不能把已知红灯的二进制上传到正式 Release。
      - name: Rust 全量测试
        # Vendored rookie's rustdoc examples open real browser profiles and are not hermetic CI
        # tests. Run every workspace unit/integration target while deliberately excluding doctests.
        run: cargo test --workspace --lib --bins --tests

      - name: 安装前端依赖
        run: npm ci

      # M7（Tauri 壳）落地之前 src-tauri/ 还不完整。这里探测一下而不是硬跑，
      # 让这条流水线在壳做好之前仍然能当"三平台 Rust 测试"用，红叉只留给真问题。
      # 判据是 tauri.conf.json 而不是目录是否存在：壳在半成品状态下（只有
      # icons/ 和 src/、还没写配置）目录就已经在了，按目录判会误触发打包。
      - name: 探测 Tauri 壳
        id: shell
        shell: bash
        run: |
          if [ -f src-tauri/tauri.conf.json ] && [ -f src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::src-tauri/tauri.conf.json 还不存在（M7 未完成），本次跳过打包，只跑测试。"
          fi

      # 脚本名以 package.json 为准：有 tauri:build 就用它（能带上项目自己的
      # 前置步骤），没有就直接调 npm ci 已从 lockfile 安装的本地 CLI；
      # --no-install 禁止 npx 在构建时临时解析或下载可漂移的 registry 包。
      #
      # Windows 首次打 NSIS 时还会从 GitHub 下载工具包，偶发的 CDN 断连会在
      # 应用、MSI 都已编好后报 `io: Peer disconnected`。Windows runner 对整个
      # Tauri 打包最多重试两次；Cargo 增量产物仍在，重试主要补齐 bundler 下载，
      # 永久性编译/配置错误则会在三次都失败后照常打红。其他平台不额外重跑。
      - name: Tauri 打包
        if: steps.shell.outputs.present == 'true'
        shell: bash
        env:
          # 与既有正式版一致：macOS 使用 ad-hoc 签名；更新包仍由 Tauri minisign 验签。
          APPLE_SIGNING_IDENTITY: "-"
          CI: "true"
          # 一键更新的 minisign 私钥（见 docs/rust-port/08 §密钥）。
          # 分支构建没配 secret 时摘掉 createUpdaterArtifacts，只做普通包验证；
          # 正式 tag 缺密钥必须失败，不能发布一个更新链断掉的版本。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::正式发行缺少 TAURI_SIGNING_PRIVATE_KEY"
              exit 1
            fi
            echo "::warning::分支构建没有 updater 私钥，本次只验证普通安装包"
            jq 'del(.bundle.createUpdaterArtifacts)' src-tauri/tauri.conf.json > /tmp/conf.json
            mv /tmp/conf.json src-tauri/tauri.conf.json
          fi
          run_tauri_build() {
            build_args=()
            if [ -n "${{ matrix.tauri_args }}" ]; then
              read -r -a build_args <<< "${{ matrix.tauri_args }}"
            fi
            if node -e "process.exit((require('./package.json').scripts||{})['tauri:build']?0:1)"; then
              npm run tauri:build -- "${build_args[@]}"
            else
              npx --no-install tauri build "${build_args[@]}"
            fi
          }

          max_attempts=1
          [[ "${RUNNER_OS:-}" == "Windows" ]] && max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if run_tauri_build; then
              break
            else
              status=$?
            fi
            if (( attempt == max_attempts )); then
              echo "::error::Tauri 打包连续 ${max_attempts} 次失败（最后退出码：${status}）"
              exit "$status"
            fi
            echo "::warning::Windows Tauri 打包失败（退出码：${status}），20 秒后进行第 $((attempt + 1))/${max_attempts} 次尝试"
            sleep 20
          done

      # Tauri 两个 macOS target 生成的 updater 归档都叫 KDJ.app.tar.gz。
      # 上传到同一 Release 前加架构后缀，避免后上传的包覆盖前者；
      # 重命名不会改变文件内容，原 minisign 签名仍然有效。
      - name: 区分 macOS updater 架构包
        if: steps.shell.outputs.present == 'true' && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          KDJ_MAC_ARCH: ${{ matrix.mac_arch }}
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r -d '' archive; do archives+=("$archive"); done \
            < <(find target src-tauri/target -type f -path '*/release/bundle/macos/KDJ.app.tar.gz' -print0 2>/dev/null || true)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::${KDJ_MAC_ARCH} 应恰好生成一个 macOS updater 归档，实际为 ${#archives[@]}"
            exit 1
          fi
          archive=${archives[0]}
          signature="$archive.sig"
          [ -f "$signature" ] || { echo "::error::$archive 缺少签名"; exit 1; }
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          destination="$(dirname "$archive")/KDJ_${version}_${KDJ_MAC_ARCH}.app.tar.gz"
          mv "$archive" "$destination"
          mv "$signature" "$destination.sig"
          echo "macOS ${KDJ_MAC_ARCH} updater: $(basename "$destination")"

      - name: 验证 updater 签名对应内置公钥
        if: steps.shell.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          cargo install rsign2 --locked --version 0.6.6
          # Tauri 配置保存的是整份 minisign .pub 文件的 base64；rsign -P 需要其中
          # 最后一行的原始公钥字符串。
          public_key=$(node -e '
            const value = require("./src-tauri/tauri.conf.json").plugins.updater.pubkey;
            const lines = Buffer.from(value, "base64").toString("utf8").trim().split(/\r?\n/);
            process.stdout.write(lines.at(-1));
          ')
          sigs=()
          while IFS= read -r -d '' sig; do
            sigs+=("$sig")
          done < <(find target src-tauri/target -type f -path '*/release/bundle/*/*.sig' -print0 2>/dev/null || true)
          if (( ${#sigs[@]} == 0 )); then
            echo "::error::正式构建没有生成 updater .sig"
            exit 1
          fi
          for sig in "${sigs[@]}"; do
            artifact=${sig%.sig}
            [ -f "$artifact" ] || { echo "::error::$sig 没有对应更新包"; exit 1; }
            # Tauri 的 .sig 是「完整 minisign 签名文本」再做一层 base64；
            # rsign 读取的是解码后的四行 minisign 文件，不能直接把 .sig 传给它。
            decoded_signature="$RUNNER_TEMP/$(basename "$sig").minisign"
            node -e '
              const fs = require("fs");
              const encoded = fs.readFileSync(process.argv[1], "utf8").trim();
              fs.writeFileSync(process.argv[2], Buffer.from(encoded, "base64"));
            ' "$sig" "$decoded_signature"
            rsign verify "$artifact" -P "$public_key" -x "$decoded_signature" -q
          done
          echo "✓ updater 私钥与 tauri.conf.json 内置公钥匹配"

      - name: 桌面安装包体积回归门禁
        if: steps.shell.outputs.present == 'true'
        shell: bash
        env:
          KDJ_BUNDLE_LABEL: ${{ matrix.label }}
          KDJ_REQUIRE_UPDATER: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bash scripts/check-desktop-bundle-size.sh \
            "$KDJ_BUNDLE_LABEL" "$version" "$KDJ_REQUIRE_UPDATER" target src-tauri/target \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # 产物路径用宽松的 `**` 通配：src-tauri 是不是 workspace 成员会决定
      # 产物落在 `target/` 还是 `src-tauri/target/`，加上 --target 又会多一层
      # 三元组目录。与其猜，不如让 glob 兜住所有情况。
      #
      # 本机实测（不带 --target 时）落点是根 `target/release/bundle/`：
      #   bundle/macos/KDJ.app  和  bundle/dmg/KDJ_0.2.0_aarch64.dmg
      # 也就是 src-tauri 作为 workspace 成员那一支。带 --target
      # aarch64/x86_64-apple-darwin 时会多一层 target triple，通配仍然兜得住。
      # *.tar.gz / *.sig / setup.exe 的 sig 是 updater 的更新包与签名，
      # latest-json 那个 job 和终端用户都要从 Release 上取，一并上传
      - name: 上传产物
        if: steps.shell.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kdj-rust-${{ matrix.label }}
          path: |
            **/release/bundle/dmg/*.dmg
            **/release/bundle/macos/*.app.tar.gz
            **/release/bundle/macos/*.app.tar.gz.sig
            **/release/bundle/nsis/*.exe
            **/release/bundle/nsis/*.exe.sig
            **/release/bundle/msi/*.msi
            **/release/bundle/msi/*.msi.sig
            **/release/bundle/appimage/*.AppImage
            **/release/bundle/appimage/*.AppImage.sig
            **/release/bundle/deb/*.deb
            **/release/bundle/deb/*.deb.sig
            **/release/bundle/rpm/*.rpm
            **/release/bundle/rpm/*.rpm.sig
          if-no-files-found: error

  publish:
    name: 发布桌面安装包
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载桌面 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bundles

      - name: 上传安装包到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find bundles -type f ! -name 'artifact-id.txt' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "::error::没有找到可上传的桌面 Release 产物"
            exit 1
          fi
          for file in "${files[@]}"; do
            uploaded=0
            for attempt in 1 2 3 4; do
              if gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY" --clobber; then
                uploaded=1
                break
              fi
              echo "::warning::上传 $(basename "$file") 失败，第 $attempt/4 次；稍后重试"
              sleep $((attempt * 15))
            done
            if (( uploaded == 0 )); then
              echo "::error::上传 $(basename "$file") 连续失败"
              exit 1
            fi
          done

  # 正式 KDJ 每个 Release 都发布一份 latest.json 更新清单。
  # 三个平台的测试、平台构建与 updater 验签必须全部通过，publish 才会上传安装包；
  # 清单最后生成并提升 Latest；带 -rc 后缀的正式推送同样进入全体用户更新通道。
  # 任一门禁失败都让上一可用版本继续作为 Latest。
  latest-json:
    name: 更新清单 latest.json
    needs: [desktop, publish]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.desktop.result != 'cancelled' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载已有平台产物
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bundles

      - name: 拼 latest.json、上传并处理更新通道
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          if [ "$DOWNLOAD_OUTCOME" != "success" ]; then
            echo "::error::没有任何桌面构建产物可下载；拒绝写入 latest.json"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, glob, sys
          from datetime import datetime, timezone
          from urllib.parse import quote

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag.lstrip("v")

          def find(label, pattern):
              hits = sorted(glob.glob(f"bundles/kdj-rust-{label}/**/{pattern}", recursive=True))
              return next((hit for hit in hits if not hit.endswith(".sig")), None)

          def entry(artifact):
              signature = artifact + ".sig"
              if not os.path.exists(signature):
                  raise SystemExit(f"::error::{os.path.basename(artifact)} 缺少签名：{signature}")
              name = os.path.basename(artifact)
              return {
                  "signature": open(signature).read().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{quote(name)}",
              }

          def build_manifest(product):
              platforms = {}
              missing = []
              for label, arch in (("macos-arm64", "aarch64"), ("macos-x86_64", "x86_64")):
                  mac = find(label, f"KDJ_{version}_{arch}.app.tar.gz")
                  if not mac:
                      raise SystemExit(f"::error::macOS {arch} updater 包缺失，拒绝发布残缺清单")
                  item = entry(mac)
                  # Tauri v2 在 macOS 优先查 *-app，再回退到 OS-ARCH。
                  # 两个 key 指向同一个当前架构的薄归档。
                  platforms[f"darwin-{arch}-app"] = item
                  platforms[f"darwin-{arch}"] = item

              nsis = find("windows-x86_64", "*-setup.exe")
              msi = find("windows-x86_64", "*.msi")
              if nsis:
                  item = entry(nsis)
                  platforms["windows-x86_64-nsis"] = item
                  platforms["windows-x86_64"] = item
              if msi:
                  platforms["windows-x86_64-msi"] = entry(msi)
              if not nsis and not msi:
                  missing.append("Windows")

              appimage = find("linux-x86_64", "*.AppImage")
              deb = find("linux-x86_64", "*.deb")
              rpm = find("linux-x86_64", "*.rpm")
              if appimage:
                  item = entry(appimage)
                  platforms["linux-x86_64-appimage"] = item
                  platforms["linux-x86_64"] = item
              if deb:
                  platforms["linux-x86_64-deb"] = entry(deb)
              if rpm:
                  platforms["linux-x86_64-rpm"] = entry(rpm)
              if not appimage and not deb and not rpm:
                  missing.append("Linux")

              for name in missing:
                  print(f"::warning::{product} 本版缺少 {name} 更新包；其它平台仍可更新")
              if not platforms:
                  raise SystemExit(f"::error::{product} 没有任何更新包，拒绝发布更新清单")
              return {
                  "version": version,
                  "notes": f"{product} {tag}",
                  "pub_date": datetime.now(timezone.utc).isoformat(),
                  "platforms": platforms,
              }

          manifest = build_manifest("KDJ")
          with open("latest.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          print(f"latest.json: {len(manifest['platforms'])} platform keys")
          PY

          upload_ok=0
          for attempt in 1 2 3 4; do
            if gh release upload "$TAG" latest.json --repo "$REPO" --clobber; then
              upload_ok=1
              break
            fi
            echo "::warning::上传更新清单失败，第 $attempt/4 次；稍后重试"
            sleep $((attempt * 15))
          done
          if [ "$upload_ok" != 1 ]; then
            echo "::error::更新清单连续上传失败"
            exit 1
          fi
          served=$(python3 -c "import json;print(json.load(open('latest.json'))['version'])")
          # 清单就绪后才抢 Latest；此前 release.yml 用 --latest=false 建的空壳
          # 不会让 /releases/latest/download/latest.json 指向残缺发版。
          # `-rc` 是版本字符串的一部分，但本项目仍把这类推送作为正式全量更新。
          gh release edit "$TAG" --repo "$REPO" --latest
          echo "已上传 latest.json 并提升 $TAG 为 Latest（version=$served）"
