# 安卓 APK（Tauri 2 mobile）。
#
# 状态：本机（macOS/arm64 + NDK r27c）已经真的编出了一个 aarch64 release APK
# ——18,025,001 B，unsigned，实测细节见 docs/rust-port/06-packaging-results.md §4。
# **但这条流水线本身仍然没在 GitHub 上跑过**，而且那个 APK 还没装进过真机：
# 装机之前必须先解决 usesCleartextTraffic（见下面风险 1），否则大概率白屏。
# 下面的风险注释已经按本机实测重排过一遍，别再照着旧版去乱设 CC_*/AR_*。
#
# 触发只留 workflow_dispatch 和 tag：安卓构建要下 SDK/NDK（~2GB）又要交叉编
# 译四遍，挂在每次 push 上纯属浪费额度，而且在壳做好之前必然跳过。
name: rust-android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# 发 Release 需要写权限（老 build.yml 首跑就是栽在只读 token 上）
permissions:
  contents: write

concurrency:
  group: rust-android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # NDK 版本必须钉死。理由：
  #   1. cargo-mobile2 / tauri 生成的 gradle 脚本按 NDK 目录名找 clang，
  #      runner 镜像里预装的版本随时会变，飘一次就是"昨天还好好的"；
  #   2. ring 0.17 和 libsqlite3-sys(bundled) 都要 NDK 里的 clang 当交叉编译器，
  #      r23 以下缺 `libgcc → libunwind` 的兼容垫片，链接会报 `-lgcc not found`。
  # r27c 已在本机实测：ring / rusqlite / rustls 全部一次编过，没手工设过
  # 任何 CC_*/AR_* 变量。换版本请连带重跑一次真机安装。
  NDK_VERSION: 27.2.12479018
  # Tauri 的 gradle 插件要求 JDK 17+。**上限也要管**：本机用系统的 JDK 22 时
  # sdkmanager 直接起不来，所以这里钉 17 而不是 latest。
  JAVA_VERSION: "17"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      # setup-android 只给 cmdline-tools，NDK 要自己点名装。
      # ANDROID_NDK_HOME / NDK_HOME 两个变量都要给：Tauri 读前者，
      # cc-rs（ring / libsqlite3-sys 的构建脚本）读后者，只给一个会在
      # "gradle 跑起来了但 cargo 编不过" 的地方失败，很难看出是缺变量。
      # platform / build-tools 的版本**必须跟着 `android init` 生成的 gradle 工程走**，
      # 不能想当然写 34。本机实测：Tauri 2.11 生成的 app/build.gradle.kts 里是
      # `compileSdk = 36 / targetSdk = 36 / minSdk = 24` + AGP 8.11.0，
      # 而 AGP 8.11 默认要 build-tools 35.0.0。装成 34 的结果是 cargo 全部编完
      # （一两个小时）之后才在 gradle 那一步倒下：
      #     Could not determine the dependencies of task ':app:minifyUniversalReleaseWithR8'.
      #     > Failed to find Build Tools revision 35.0.0
      # 这个报错和交叉编译毫无关系，别顺着 NDK 方向查。
      # 以后 Tauri 升版把 compileSdk 顶到 37 时，这里也要跟着改——
      # 判断方法：init 之后 grep 一下 gen/android/app/build.gradle.kts。
      - name: 安装 NDK 与 SDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" \
                     "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # 只装真机会用到的两个 ABI：aarch64 覆盖 2018 年后基本所有机器，
      # armv7 兜老设备。i686 / x86_64 是模拟器用的，要跑模拟器再补
      # （同时 `tauri android build` 的 --target 也要一起加，否则 gradle
      #  找不到那个 ABI 的 .so 会直接失败）。
      #
      # 注意：`android init` 自己还会 rustup 补装 i686 / x86_64（本机实测），
      # 所以这里少装两个不会让 init 失败，只是 init 那一步会多花一点时间下载。
      - name: 安装 Rust 与安卓 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: 安装前端依赖
        run: npm ci

      # 判据同 rust-build.yml：看 tauri.conf.json 而不是目录，
      # 半成品的 src-tauri/ 目录会让 `android init` 报一堆没头没尾的错。
      - name: 探测 Tauri 壳
        id: shell
        run: |
          if [ -f src-tauri/tauri.conf.json ] && [ -f src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::src-tauri/tauri.conf.json 还不存在（M7/M8 未完成），安卓构建跳过。"
          fi

      # `android init` 生成 src-tauri/gen/android/（gradle 工程）。
      # 已知坑：
      #   - identifier 里带 `-` 或以数字开头会被 Java 包名规则拒掉。
      #     现在的 `com.kumodeck.app` 是合法的（本机 init 一次通过），但 Tauri 会
      #     告警说 `.app` 结尾和 macOS 的 bundle 扩展名冲突。要不要换是产品身份
      #     决定，交用户拍板；换的时候注意它不影响数据目录——
      #     `src-tauri/src/lib.rs::legacy_data_dir` 取的是 app_config_dir 的父目录。
      #   - gen/android 是生成物，按 Tauri 官方建议**不进版本库**，所以 CI 每次都要 init；
      #     如果以后要改 AndroidManifest（比如加 INTERNET / 存储权限），
      #     得把 gen/android 提交进仓库或改用 tauri 的 manifest 合并配置，
      #     否则每次 init 都会把手改冲掉。
      - name: tauri android init
        if: steps.shell.outputs.present == 'true'
        run: npx --yes @tauri-apps/cli@^2 android init

      # 风险 1 的解法：release 也放行明文 HTTP。
      # 这个 app 的前端在 WebView 里对 127.0.0.1 上的进程内 axum 发明文请求
      # （token 鉴权，见 auth.rs），Android 对 targetSdk 28+ 默认禁明文，
      # 不开的话 release 包装上真机就是白屏。四家平台的 API 全走 https，
      # 实际放行的只有本机回环这一条。gen/android 不进版本库，所以必须在
      # init 之后每次都补——模板里 debug 本来就是 true，这里只翻 release 的默认值。
      - name: 放行 localhost 明文（改 usesCleartextTraffic）
        if: steps.shell.outputs.present == 'true'
        run: |
          set -euo pipefail
          f=src-tauri/gen/android/app/build.gradle.kts
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' "$f"
          grep -n 'usesCleartextTraffic' "$f"
          # sed 打空是静默的：模板哪天改了形状，这里必须炸而不是装作补完了
          if grep -q 'usesCleartextTraffic"\] = "false"' "$f"; then
            echo '::error::usesCleartextTraffic 还留着 false，sed 没打中——去对一下模板形状'
            exit 1
          fi

      # init 出来的 gradle 工程带的是 Tauri 默认图标。真图标（`tauri icon` 的产物）
      # 提交在 src-tauri/icons/android/ 里，覆盖过去；顺带把自适应图标的背景层
      # 从模板的 #fff 换成应用底色——白底配深色图会在圆形遮罩里露一圈白边。
      - name: 同步应用图标进 gradle 工程
        if: steps.shell.outputs.present == 'true'
        run: |
          set -euo pipefail
          cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          grep -o '#[0-9a-fA-F]*' src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml

      # 风险表已按本机实测（NDK r27c）重排。**先看下面这三条已经被证伪的**，
      # 别再花时间去调 CC_*/AR_*：
      #   ✅ ring 0.17 交叉编译：一次编过，没设过任何 CC_*/AR_*。
      #   ✅ rusqlite bundled（cc 编 SQLite 的 C 源码）：一次编过。
      #   ✅ rustls / hyper-rustls：一次编过。
      # 也就是说 r27c 自带的 clang 能被 cc-rs 自动找到，前提是
      # ANDROID_NDK_HOME 和 NDK_HOME **两个都设了**（上一步已经设）。
      #
      # ✅ INTERNET 权限也不用操心：Tauri 模板生成的
      #    gen/android/app/src/main/AndroidManifest.xml 第 3 行自带
      #    <uses-permission android:name="android.permission.INTERNET" />，
      #    manifest-merger report 确认合进去了。（旧注释把它列成第一风险，是猜的。）
      #
      # 还没被证伪、真正要担心的（按概率排）：
      #   1. ✅ ~~明文 HTTP 被禁~~ 已解决：init 之后的「放行 localhost 明文」
      #      步骤把 release 的 usesCleartextTraffic 翻成 true（本机 merged
      #      manifest 已验证），细节与取舍见 06-packaging-results.md §4.7 后记。
      #   2. **签名**：这里出的是未签名 APK（产物名就叫 *-unsigned.apk），
      #      直接装到真机可能被 "应用未安装" 拒绝。正式发版要配
      #      ANDROID_KEY_BASE64 / ANDROID_KEY_PASSWORD 之类的 secrets，
      #      在 gen/android/app/build.gradle.kts 里挂 signingConfigs。
      #      骨架阶段先不引入 secrets，免得给一个空 secret 更难排查。
      #   3. **16KB page size**：Android 15 起要求 .so 按 16KB 对齐，
      #      老 NDK 编出来的库在新机器上会加载失败——这也是钉 r27 的理由之一。
      #      r27c 编出来的库还没装进真机验证过。
      #   4. **minSdk**：Tauri 2 要求 API 24+，WebView 版本太老的机器直接白屏。
      #
      # 时间预期：冷编一次 aarch64 全图（约 600 个 crate）在根 Cargo.toml 的
      # release 档下（opt-level=z + lto + codegen-units=1）**要按小时算**。
      # 上面的 rust-cache 因此是刚需，不是优化。
      - name: tauri android build --apk
        if: steps.shell.outputs.present == 'true'
        run: npx --yes @tauri-apps/cli@^2 android build --apk --target aarch64 --target armv7

      - name: 上传 APK
        if: steps.shell.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kumodeck-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 和 rust-build.yml 的桌面产物进**同一个** Release（softprops 对已存在的
      # Release 是追加文件，不会另建）。tag 的来源有两条路都成立：
      # release.yml 检测到新版本号后 dispatch 到 tag ref，或者手动 push tag。
      - name: 发布 Release（仅 tag）
        if: steps.shell.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
