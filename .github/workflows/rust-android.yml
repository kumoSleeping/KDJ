# 安卓 APK（Tauri 2 mobile）。
#
# 状态：本机（macOS/arm64 + NDK r27c）能编出 aarch64 release APK，明文放行和
# 签名都已就位（见 scripts/android-postinit.sh），实测细节在
# docs/rust-port/06-packaging-results.md §4 和 08-updates-and-signing.md。
# **仍未验证**：这条流水线没在 GitHub 上真跑过，APK 也没装进过真机。
# 下面的风险注释已按本机实测重排，别再照着旧版去乱设 CC_*/AR_*。
#
# 触发只留 workflow_dispatch 和 tag：安卓构建要下 SDK/NDK（~2GB）又要交叉编
# 译四遍，挂在每次 push 上纯属浪费额度，而且在壳做好之前必然跳过。
name: rust-android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# 发 Release 需要写权限（老 build.yml 首跑就是栽在只读 token 上）
permissions:
  contents: write

concurrency:
  group: rust-android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # NDK 版本必须钉死。理由：
  #   1. cargo-mobile2 / tauri 生成的 gradle 脚本按 NDK 目录名找 clang，
  #      runner 镜像里预装的版本随时会变，飘一次就是"昨天还好好的"；
  #   2. ring 0.17 和 libsqlite3-sys(bundled) 都要 NDK 里的 clang 当交叉编译器，
  #      r23 以下缺 `libgcc → libunwind` 的兼容垫片，链接会报 `-lgcc not found`。
  # r27c 已在本机实测：ring / rusqlite / rustls 全部一次编过，没手工设过
  # 任何 CC_*/AR_* 变量。换版本请连带重跑一次真机安装。
  NDK_VERSION: 27.2.12479018
  # Tauri 的 gradle 插件要求 JDK 17+。**上限也要管**：本机用系统的 JDK 22 时
  # sdkmanager 直接起不来，所以这里钉 17 而不是 latest。
  JAVA_VERSION: "17"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      # setup-android 只给 cmdline-tools，NDK 要自己点名装。
      # ANDROID_NDK_HOME / NDK_HOME 两个变量都要给：Tauri 读前者，
      # cc-rs（ring / libsqlite3-sys 的构建脚本）读后者，只给一个会在
      # "gradle 跑起来了但 cargo 编不过" 的地方失败，很难看出是缺变量。
      # platform / build-tools 的版本**必须跟着 `android init` 生成的 gradle 工程走**，
      # 不能想当然写 34。本机实测：Tauri 2.11 生成的 app/build.gradle.kts 里是
      # `compileSdk = 36 / targetSdk = 36 / minSdk = 24` + AGP 8.11.0，
      # 而 AGP 8.11 默认要 build-tools 35.0.0。装成 34 的结果是 cargo 全部编完
      # （一两个小时）之后才在 gradle 那一步倒下：
      #     Could not determine the dependencies of task ':app:minifyUniversalReleaseWithR8'.
      #     > Failed to find Build Tools revision 35.0.0
      # 这个报错和交叉编译毫无关系，别顺着 NDK 方向查。
      # 以后 Tauri 升版把 compileSdk 顶到 37 时，这里也要跟着改——
      # 判断方法：init 之后 grep 一下 gen/android/app/build.gradle.kts。
      - name: 安装 NDK 与 SDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" \
                     "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # SCNet Vulkan 的 pinned ExecuTorch AAR 只带 arm64-v8a / x86_64；本测试版只发
      # 真机主流的 aarch64，不能再假装 armv7 能运行后把 APK 交给用户。i686/x86_64
      # 是模拟器用的，要跑模拟器再补对应 target 和 AAR ABI。
      #
      # 注意：`android init` 自己还会 rustup 补装 i686 / x86_64（本机实测），
      # 所以这里少装两个不会让 init 失败，只是 init 那一步会多花一点时间下载。
      - name: 安装 Rust 与安卓 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: 安装前端依赖
        run: npm ci

      # 判据同 rust-build.yml：看 tauri.conf.json 而不是目录，
      # 半成品的 src-tauri/ 目录会让 `android init` 报一堆没头没尾的错。
      - name: 探测 Tauri 壳
        id: shell
        run: |
          if [ -f src-tauri/tauri.conf.json ] && [ -f src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::src-tauri/tauri.conf.json 还不存在（M7/M8 未完成），安卓构建跳过。"
          fi

      # `android init` 生成 src-tauri/gen/android/（gradle 工程）。
      # 已知坑：
      #   - identifier 里带 `-` 或以数字开头会被 Java 包名规则拒掉。
      #     正式身份固定为 `com.kdj.app`；从首个正式签名 APK 起不要再改，Android
      #     覆盖升级同时认 applicationId 和签名证书，任意一个变化都会变成另一个应用。
      #     `.app` 结尾会触发 Tauri 的 macOS 扩展名提示，但不影响 Android 包名；
      #     它也不影响数据目录——
      #     `src-tauri/src/lib.rs::legacy_data_dir` 取的是 app_config_dir 的父目录。
      #   - gen/android 是生成物，按 Tauri 官方建议**不进版本库**，所以 CI 每次都要 init；
      #     如果以后要改 AndroidManifest（比如加 INTERNET / 存储权限），
      #     得把 gen/android 提交进仓库或改用 tauri 的 manifest 合并配置，
      #     否则每次 init 都会把手改冲掉。
      - name: tauri android init
        if: steps.shell.outputs.present == 'true'
        run: npx --yes @tauri-apps/cli@^2 android init

      # Tag 是正式交付物，缺任意正式密钥都必须在耗时构建之前停下。
      - name: 验证正式发行签名密钥
        if: steps.shell.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::正式发行缺少 GitHub Secret：$name"
              exit 1
            fi
          done

      # 正式 tag 使用稳定的发布密钥；把 secret 写进环境而不是直接传给 post-init，
      # 这样测试签名和正式签名走同一个脚本分支，且脚本不必知道 GitHub Actions。
      - name: 配置正式发行签名环境
        if: steps.shell.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          {
            echo "ANDROID_KEYSTORE_BASE64=$ANDROID_KEYSTORE_BASE64"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      # workflow_dispatch 的分支 APK 也要能实际装进设备收诊断，不能上传一个只能
      # 验证编译的 unsigned 文件。每次 runner 生成独立测试证书：它绝不能用于发布，
      # 也不能覆盖由正式 tag 使用的稳定签名。
      - name: 生成可安装的测试签名
        if: steps.shell.outputs.present == 'true' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          key_store="$RUNNER_TEMP/kdj-device-test.jks"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$key_store" -storepass kdj-device-test \
            -alias kdj-device-test -keypass kdj-device-test \
            -dname 'CN=KDJ Device Test, OU=Test, O=KDJ, C=ZZ' \
            -keyalg RSA -keysize 2048 -validity 7
          {
            echo "ANDROID_KEYSTORE_PATH=$key_store"
            echo 'ANDROID_KEYSTORE_PASSWORD=kdj-device-test'
            echo 'ANDROID_KEY_ALIAS=kdj-device-test'
            echo 'ANDROID_KEY_PASSWORD=kdj-device-test'
          } >> "$GITHUB_ENV"

      # init 之后必须重做的五件事（明文放行 / 权限 / ExecuTorch / 签名 / 图标）统一交给
      # scripts/android-postinit.sh —— 本地和 CI 跑**同一份**脚本。
      # 各写一套的下场是"我这儿能装、CI 出来的装不上"，而且这种差异
      # 只有等到把 APK 拷进手机那一刻才会暴露。
      #
      # 签名环境在上两步确定：tag 用 repo secrets，非 tag 用一次性的设备测试证书。
      - name: init 后置补丁（明文 / 权限 / ExecuTorch / 签名 / 图标）
        if: steps.shell.outputs.present == 'true'
        run: ./scripts/android-postinit.sh

      # 风险表已按本机实测（NDK r27c）重排。**先看下面这三条已经被证伪的**，
      # 别再花时间去调 CC_*/AR_*：
      #   ✅ ring 0.17 交叉编译：一次编过，没设过任何 CC_*/AR_*。
      #   ✅ rusqlite bundled（cc 编 SQLite 的 C 源码）：一次编过。
      #   ✅ rustls / hyper-rustls：一次编过。
      # 也就是说 r27c 自带的 clang 能被 cc-rs 自动找到，前提是
      # ANDROID_NDK_HOME 和 NDK_HOME **两个都设了**（上一步已经设）。
      #
      # ✅ INTERNET 权限也不用操心：Tauri 模板生成的
      #    gen/android/app/src/main/AndroidManifest.xml 第 3 行自带
      #    <uses-permission android:name="android.permission.INTERNET" />，
      #    manifest-merger report 确认合进去了。（旧注释把它列成第一风险，是猜的。）
      #
      # 还没被证伪、真正要担心的（按概率排）：
      #   1. ✅ ~~明文 HTTP 被禁~~ 已解决：init 之后的「放行 localhost 明文」
      #      步骤把 release 的 usesCleartextTraffic 翻成 true（本机 merged
      #      manifest 已验证），细节与取舍见 06-packaging-results.md §4.7 后记。
      #   2. ✅ ~~签名~~ 已解决：android-postinit.sh 注入 signingConfigs；tag 还原
      #      正式 keystore，测试构建生成一次性设备签名，产物始终是可安装的
      #      app-arm64-release.apk（不带 -unsigned 后缀）。
      #   3. **16KB page size**：Android 15 起要求 .so 按 16KB 对齐，
      #      老 NDK 编出来的库在新机器上会加载失败——这也是钉 r27 的理由之一。
      #      r27c 编出来的库还没装进真机验证过。
      #   4. **minSdk**：原生后台播放器要求 API 26+（Android 8），与实时音频
      #      后续使用的 AAudio 下限一致；更老系统由安装器直接拒绝，不能运行时崩溃。
      #
      # 时间预期：冷编一次 aarch64 全图（约 600 个 crate）在根 Cargo.toml 的
      # release 档下（opt-level=z + lto + codegen-units=1）**要按小时算**。
      # 上面的 rust-cache 因此是刚需，不是优化。
      - name: 验证 YTM OAuth 凭据
        if: steps.shell.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          KDJ_YTM_OAUTH_CLIENT_ID: ${{ secrets.KDJ_YTM_OAUTH_CLIENT_ID }}
          KDJ_YTM_OAUTH_CLIENT_SECRET: ${{ secrets.KDJ_YTM_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in KDJ_YTM_OAUTH_CLIENT_ID KDJ_YTM_OAUTH_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::正式发行缺少 GitHub Secret：$name（YouTube Music 登录将不可用）"
              exit 1
            fi
          done

      - name: tauri android build --apk
        if: steps.shell.outputs.present == 'true'
        env:
          # YouTube Music 登录凭据：打包时经 option_env! 烧进二进制。
          # 分支构建缺失可接受（产物里登录不可用）；正式 tag 已由上面的门禁强制。
          KDJ_YTM_OAUTH_CLIENT_ID: ${{ secrets.KDJ_YTM_OAUTH_CLIENT_ID }}
          KDJ_YTM_OAUTH_CLIENT_SECRET: ${{ secrets.KDJ_YTM_OAUTH_CLIENT_SECRET }}
        # ExecuTorch Vulkan 的 arm64 native runtime 与 Rust 主库只发一份。模型 .pte 在
        # 首次启用 STEM 时下载到 app data，不打进 APK；不要构造包含不支持 armv7 的
        # universal 包。
        run: npx --yes @tauri-apps/cli@^2 android build --apk --split-per-abi --target aarch64

      - name: APK 单包体积门禁
        if: steps.shell.outputs.present == 'true'
        run: ./scripts/check-android-apk-size.sh

      - name: 验证测试 APK 可安装签名
        if: steps.shell.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*-release.apk' -print | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::没有找到可安装的 *-release.apk"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify -v "$apk"
          done

      - name: 验证正式 APK 确实已签名
        if: steps.shell.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*-release.apk' -print | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::没有找到已签名的 *-release.apk"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs -v "$apk"
          done

      - name: 上传 APK
        if: steps.shell.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kdj-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 和 rust-build.yml 的桌面产物进**同一个** Release（softprops 对已存在的
      # Release 是追加文件，不会另建）。tag 的来源有两条路都成立：
      # release.yml 检测到新版本号后 dispatch 到 tag ref，或者手动 push tag。
      - name: 发布 Release（仅 tag）
        if: steps.shell.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 不在这里抢 Latest；桌面 latest-json 写好清单后再提升。
          make_latest: false
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
