# 安卓 APK（Tauri 2 mobile）。
#
# 状态：本机（macOS/arm64 + NDK r27c）能编出 aarch64 release APK，明文放行和
# 签名都已就位（见 scripts/android-postinit.sh），实测细节在
# docs/rust-port/06-packaging-results.md §4 和 08-updates-and-signing.md。
# **仍未验证**：这条流水线没在 GitHub 上真跑过，APK 也没装进过真机。
# 下面的风险注释已按本机实测重排，别再照着旧版去乱设 CC_*/AR_*。
#
# 触发只留 workflow_dispatch 和 tag：安卓构建要下 SDK/NDK（~2GB）又要交叉编
# 译四遍，挂在每次 push 上纯属浪费额度，而且在壳做好之前必然跳过。
name: rust-android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# APK 构建 job 只读；只有独立 publish job 临时获得 contents:write。
permissions:
  contents: read

concurrency:
  group: rust-android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # NDK 版本必须钉死。理由：
  #   1. cargo-mobile2 / tauri 生成的 gradle 脚本按 NDK 目录名找 clang，
  #      runner 镜像里预装的版本随时会变，飘一次就是"昨天还好好的"；
  #   2. ring 0.17 和 libsqlite3-sys(bundled) 都要 NDK 里的 clang 当交叉编译器，
  #      r23 以下缺 `libgcc → libunwind` 的兼容垫片，链接会报 `-lgcc not found`。
  # r27c 已在本机实测：ring / rusqlite / rustls 全部一次编过，没手工设过
  # 任何 CC_*/AR_* 变量。换版本请连带重跑一次真机安装。
  NDK_VERSION: 27.2.12479018
  # Tauri 的 gradle 插件要求 JDK 17+。**上限也要管**：本机用系统的 JDK 22 时
  # sdkmanager 直接起不来，所以这里钉 17 而不是 latest。
  JAVA_VERSION: "17"
  # 从已发布的 v0.2.44 app-arm64-release.apk（apksig 验证通过）提取的正式证书。
  # 证书是公开身份锚；后续轮换必须作为显式迁移处理，不能随 keystore secret 漂移。
  ANDROID_RELEASE_CERT_SHA256: BD0C0FBEBB1FDE10AC910458542E46C6204FAC3F3B4E3F27B0255D4E6480EA72

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # GitHub Ubuntu runner 预装并维护 Android cmdline-tools，但 sdkmanager 所在
      # 目录不保证进入 PATH；从官方 ANDROID_HOME 的固定位置验证并加入后续步骤 PATH。
      - name: 验证 Android SDK 工具链
        run: |
          set -euo pipefail
          sdkmanager_dir="$ANDROID_HOME/cmdline-tools/latest/bin"
          sdkmanager="$sdkmanager_dir/sdkmanager"
          [ -x "$sdkmanager" ] || {
            echo "::error::找不到 GitHub runner 预装的 sdkmanager：$sdkmanager"
            exit 1
          }
          echo "$sdkmanager_dir" >> "$GITHUB_PATH"
          "$sdkmanager" --version

      # NDK 要自己点名装。
      # ANDROID_NDK_HOME / NDK_HOME 两个变量都要给：Tauri 读前者，
      # cc-rs（ring / libsqlite3-sys 的构建脚本）读后者，只给一个会在
      # "gradle 跑起来了但 cargo 编不过" 的地方失败，很难看出是缺变量。
      # platform / build-tools 的版本**必须跟着 `android init` 生成的 gradle 工程走**，
      # 不能想当然写 34。本机实测：Tauri 2.11 生成的 app/build.gradle.kts 里是
      # `compileSdk = 36 / targetSdk = 36 / minSdk = 24` + AGP 8.11.0，
      # 而 AGP 8.11 默认要 build-tools 35.0.0。装成 34 的结果是 cargo 全部编完
      # （一两个小时）之后才在 gradle 那一步倒下：
      #     Could not determine the dependencies of task ':app:minifyUniversalReleaseWithR8'.
      #     > Failed to find Build Tools revision 35.0.0
      # 这个报错和交叉编译毫无关系，别顺着 NDK 方向查。
      # 以后 Tauri 升版把 compileSdk 顶到 37 时，这里也要跟着改——
      # 判断方法：init 之后 grep 一下 gen/android/app/build.gradle.kts。
      - name: 安装 NDK 与 SDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" \
                     "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # 注意：`android init` 自己还会 rustup 补装 i686 / x86_64（本机实测），
      # 所以这里少装两个不会让 init 失败，只是 init 那一步会多花一点时间下载。
      - name: 安装 Rust 与安卓 target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android

      - name: 安装前端依赖
        run: npm ci

      - name: npm 依赖漏洞与注册表签名门禁
        run: |
          npm audit --audit-level=low
          npm audit signatures

      - name: 前端逻辑与生产构建门禁
        run: |
          npm run test:frontend-logic
          npm run tauri:web:build

      - name: Cargo 依赖漏洞门禁
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2
          # RUSTSEC-2024-0429 已在 vendor/glib-0.18.5 逐行回补上游 0.20 修复；
          # path source 会被 cargo-audit 正确排除，不设置 ignore，任何普通漏洞仍硬失败。
          cargo audit

      # 判据同 rust-build.yml：看 tauri.conf.json 而不是目录，
      # 半成品的 src-tauri/ 目录会让 `android init` 报一堆没头没尾的错。
      - name: 探测 Tauri 壳
        id: shell
        run: |
          if [ -f src-tauri/tauri.conf.json ] && [ -f src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::src-tauri/tauri.conf.json 还不存在（M7/M8 未完成），安卓构建跳过。"
          fi

      # `android init` 生成 src-tauri/gen/android/（gradle 工程）。
      # 已知坑：
      #   - identifier 里带 `-` 或以数字开头会被 Java 包名规则拒掉。
      #     正式身份固定为 `com.kdj.app`；从首个正式签名 APK 起不要再改，Android
      #     覆盖升级同时认 applicationId 和签名证书，任意一个变化都会变成另一个应用。
      #     `.app` 结尾会触发 Tauri 的 macOS 扩展名提示，但不影响 Android 包名；
      #     它也不影响数据目录——
      #     `src-tauri/src/lib.rs::legacy_data_dir` 取的是 app_config_dir 的父目录。
      #   - gen/android 是生成物，按 Tauri 官方建议**不进版本库**，所以 CI 每次都要 init；
      #     如果以后要改 AndroidManifest（比如加 INTERNET / 存储权限），
      #     得把 gen/android 提交进仓库或改用 tauri 的 manifest 合并配置，
      #     否则每次 init 都会把手改冲掉。
      - name: tauri android init
        if: steps.shell.outputs.present == 'true'
        run: npx --no-install tauri android init

      # Secret 只进入这一小步：脚本将 keystore 与 Gradle properties 写入生成目录，
      # 后续耗时构建不再继承 base64、口令或 alias。并在编译前核对既有发布证书身份。
      - name: 配置并验证正式发行签名
        if: steps.shell.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::正式发行缺少 GitHub Secret：$name"
              exit 1
            fi
          done
          ./scripts/android-postinit.sh
          actual=$(
            LC_ALL=C keytool -list -v \
              -keystore src-tauri/gen/android/app/release.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )
          if [ "$actual" != "$ANDROID_RELEASE_CERT_SHA256" ]; then
            echo "::error::Android keystore 证书不匹配：expected=$ANDROID_RELEASE_CERT_SHA256 actual=${actual:-missing}"
            exit 1
          fi
          echo "✓ Android 发布证书身份已确认"

      # workflow_dispatch 的分支 APK 也要能实际装进设备收诊断，不能上传一个只能
      # 验证编译的 unsigned 文件。每次 runner 生成独立测试证书：它绝不能用于发布，
      # 也不能覆盖由正式 tag 使用的稳定签名。
      - name: 生成可安装的测试签名
        if: steps.shell.outputs.present == 'true' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          key_store="$RUNNER_TEMP/kdj-device-test.jks"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$key_store" -storepass kdj-device-test \
            -alias kdj-device-test -keypass kdj-device-test \
            -dname 'CN=KDJ Device Test, OU=Test, O=KDJ, C=ZZ' \
            -keyalg RSA -keysize 2048 -validity 7
          ANDROID_KEYSTORE_PATH="$key_store" \
          ANDROID_KEYSTORE_PASSWORD=kdj-device-test \
          ANDROID_KEY_ALIAS=kdj-device-test \
          ANDROID_KEY_PASSWORD=kdj-device-test \
            ./scripts/android-postinit.sh

      # 风险表已按本机实测（NDK r27c）重排。**先看下面这三条已经被证伪的**，
      # 别再花时间去调 CC_*/AR_*：
      #   ✅ ring 0.17 交叉编译：一次编过，没设过任何 CC_*/AR_*。
      #   ✅ rusqlite bundled（cc 编 SQLite 的 C 源码）：一次编过。
      #   ✅ rustls / hyper-rustls：一次编过。
      # 也就是说 r27c 自带的 clang 能被 cc-rs 自动找到，前提是
      # ANDROID_NDK_HOME 和 NDK_HOME **两个都设了**（上一步已经设）。
      #
      # ✅ INTERNET 权限也不用操心：Tauri 模板生成的
      #    gen/android/app/src/main/AndroidManifest.xml 第 3 行自带
      #    <uses-permission android:name="android.permission.INTERNET" />，
      #    manifest-merger report 确认合进去了。（旧注释把它列成第一风险，是猜的。）
      #
      # 还没被证伪、真正要担心的（按概率排）：
      #   1. ✅ ~~明文 HTTP 被禁~~ 已解决：network-security-config 只对
      #      localhost / 127.0.0.1 放行，其余目标继续拒绝明文。
      #   2. ✅ ~~签名~~ 已解决：android-postinit.sh 注入 signingConfigs；tag 还原
      #      正式 keystore，测试构建生成一次性设备签名，产物始终是可安装的
      #      app-arm64-release.apk（不带 -unsigned 后缀）。
      #   3. **16KB page size**：Android 15 起要求 .so 按 16KB 对齐，
      #      老 NDK 编出来的库在新机器上会加载失败——这也是钉 r27 的理由之一。
      #      r27c 编出来的库还没装进真机验证过。
      #   4. **minSdk**：原生后台播放器要求 API 26+（Android 8），与实时音频
      #      后续使用的 AAudio 下限一致；更老系统由安装器直接拒绝，不能运行时崩溃。
      #
      # 时间预期：冷编一次 aarch64 全图（约 600 个 crate）在根 Cargo.toml 的
      # release 档下（opt-level=2 + lto + codegen-units=1）**要按小时算**。
      # 上面的 rust-cache 因此是刚需，不是优化。
      - name: tauri android build --apk
        if: steps.shell.outputs.present == 'true'
        # 正式移动端只交付主流真机的 arm64 包；不打包已停用的模型 runtime。
        env:
          KDJ_ANDROID_BUILD_MARKER: ${{ runner.temp }}/kdj-android-build-start
        run: |
          # 后续门禁只接受比这个标记新的 APK，不能把缓存或工作目录里的旧包当成本次结果。
          touch "$KDJ_ANDROID_BUILD_MARKER"
          npx --no-install tauri android build --apk --split-per-abi --target aarch64

      - name: APK 单包体积门禁
        if: steps.shell.outputs.present == 'true'
        env:
          KDJ_ANDROID_BUILD_MARKER: ${{ runner.temp }}/kdj-android-build-start
        run: |
          set -o pipefail
          ./scripts/check-android-apk-size.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 验证 APK 签名与正式证书身份
        if: steps.shell.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*-release.apk' -print | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::没有找到可安装的 *-release.apk"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            certs=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs -v "$apk")
            printf '%s\n' "$certs"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              actual=$(
                printf '%s\n' "$certs" \
                  | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
                  | tr -d ':' \
                  | tr '[:lower:]' '[:upper:]'
              )
              if [ "$actual" != "$ANDROID_RELEASE_CERT_SHA256" ]; then
                echo "::error::正式 APK 证书不匹配：expected=$ANDROID_RELEASE_CERT_SHA256 actual=${actual:-missing}"
                exit 1
              fi
            fi
          done

      - name: 清理 runner 上的 Android 签名材料
        if: ${{ always() && steps.shell.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_file in \
            src-tauri/gen/android/app/release.jks \
            src-tauri/gen/android/app/keystore.properties; do
            if [ -f "$secret_file" ]; then
              shred --remove --zero "$secret_file"
            fi
          done

      - name: 上传 APK
        if: steps.shell.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kdj-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    name: 发布 Android APK
    needs: apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kdj-android-apk
          path: bundles

      - name: 上传 APK 到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find bundles -type f -name '*-release.apk' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "::error::没有找到可发布的 APK"
            exit 1
          fi
          for file in "${files[@]}"; do
            uploaded=0
            for attempt in 1 2 3 4; do
              if gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY" --clobber; then
                uploaded=1
                break
              fi
              echo "::warning::上传 $(basename "$file") 失败，第 $attempt/4 次；稍后重试"
              sleep $((attempt * 15))
            done
            if (( uploaded == 0 )); then
              echo "::error::APK 连续上传失败"
              exit 1
            fi
          done
