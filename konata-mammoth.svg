<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">泉此方骑猛犸象</title>
  <desc id="desc">穿着红白水手服的泉此方，长蓝发迎风飘扬，悠闲地坐在一头棕色长毛猛犸象背上。背景是薄荷色天空、雪山和开满小花的草地。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#c8e9e7"/><stop offset="1" stop-color="#f8f4db"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#bd8255"/><stop offset="0.55" stop-color="#97613f"/><stop offset="1" stop-color="#704633"/>
    </linearGradient>
    <linearGradient id="head" x2="0.85" y2="1">
      <stop stop-color="#c08a5a"/><stop offset="1" stop-color="#94603f"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#608adb"/><stop offset="0.55" stop-color="#456bbd"/><stop offset="1" stop-color="#334b99"/>
    </linearGradient>
    <linearGradient id="ivory" x2="0.4" y2="1">
      <stop stop-color="#fffbea"/><stop offset="1" stop-color="#dbca9f"/>
    </linearGradient>
    <pattern id="grain" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.8" fill="#694f39" opacity="0.07"/>
      <circle cx="15" cy="17" r="0.6" fill="#694f39" opacity="0.05"/>
    </pattern>
    <g id="grass" fill="none" stroke="#688b70" stroke-width="3" stroke-linecap="round">
      <path d="M0 0l-5-12M0 0l5-17M0 0l12-7"/>
    </g>
    <g id="flower">
      <path d="M0 0v-19" stroke="#668770" stroke-width="2.5"/>
      <g fill="#fff8e8"><ellipse cy="-24" rx="3.5" ry="7"/><ellipse cy="-24" rx="3.5" ry="7" transform="rotate(60 0 -24)"/><ellipse cy="-24" rx="3.5" ry="7" transform="rotate(120 0 -24)"/></g>
      <circle cy="-24" r="3.2" fill="#e7b75d"/>
    </g>
  </defs>

