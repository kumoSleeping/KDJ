[workspace]
resolver = "2"
members = [
    "crates/kdj-core",
    "crates/kdj-providers",
    "crates/kdj-analysis",
    "crates/kdj-library",
    "crates/kdj-server",
    "src-tauri",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
