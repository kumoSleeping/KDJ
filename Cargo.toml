[workspace]
resolver = "2"
members = [
    "crates/kdj-core",
    "crates/kdj-providers",
    "crates/kdj-analysis",
    "crates/kdj-stems",
    "crates/kdj-player",
    "crates/kdj-playback",
    "crates/kdj-library",
    "crates/kdj-server",
    "src-tauri",
]
exclude = ["vendor/rookie", "vendor/glib-0.18.5"]

[patch.crates-io]
# Tauri's GTK3 stack still requires glib 0.18. Backport the upstream 0.20 pointer
# fix for RUSTSEC-2024-0429 until that dependency chain moves to a maintained API.
glib = { path = "vendor/glib-0.18.5" }

[workspace.package]
version = "1.0.0-rc2"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[profile.release]
# Audio decode, waveform extraction and realtime DSP are throughput paths. `z` more than doubled
# cold waveform latency on M2. Keep the application/server/provider surface size-optimized while
# pinning the actual audio/DSP packages back to level 2 below.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Latency-sensitive workspace crates. These own decode, waveform, realtime playback and STEM DSP.
[profile.release.package.kdj-analysis]
opt-level = 2
[profile.release.package.kdj-stems]
opt-level = 2
[profile.release.package.kdj-player]
opt-level = 2
[profile.release.package.kdj-playback]
opt-level = 2

# Their hot loops live mostly in dependencies, so only overriding the workspace wrappers is not
# enough. Keep codecs/resamplers/FFT throughput-optimized while the rest of the graph uses `s`.
[profile.release.package.rubato]
opt-level = 2
[profile.release.package.rustfft]
opt-level = 2
[profile.release.package.realfft]
opt-level = 2
[profile.release.package.symphonia]
opt-level = 2
[profile.release.package.symphonia-core]
opt-level = 2
[profile.release.package.symphonia-bundle-flac]
opt-level = 2
[profile.release.package.symphonia-bundle-mp3]
opt-level = 2
[profile.release.package.symphonia-codec-aac]
opt-level = 2
[profile.release.package.symphonia-codec-alac]
opt-level = 2
[profile.release.package.symphonia-codec-pcm]
opt-level = 2
[profile.release.package.symphonia-codec-vorbis]
opt-level = 2
[profile.release.package.symphonia-format-isomp4]
opt-level = 2
[profile.release.package.symphonia-format-mkv]
opt-level = 2
[profile.release.package.symphonia-format-ogg]
opt-level = 2
[profile.release.package.symphonia-format-riff]
opt-level = 2

# tauri:dev 默认是 debug：波形/分析在未优化下单曲要几十秒，播放条会一直空着。
# `package."*"` 只覆盖 crates.io 依赖，不覆盖 workspace member——所以分析、STEM 和
# callback 前的实时播放热路径必须单独开。业务 UI / 路由 crate 仍保持未优化，增量编译友好。
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.kdj-analysis]
opt-level = 2
[profile.dev.package.kdj-stems]
opt-level = 2
[profile.dev.package.kdj-player]
opt-level = 2
[profile.dev.package.kdj-playback]
opt-level = 2
