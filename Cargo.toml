[workspace]
resolver = "2"
members = [
    "crates/kdj-core",
    "crates/kdj-providers",
    "crates/kdj-analysis",
    "crates/kdj-stems",
    "crates/kdj-player",
    "crates/kdj-playback",
    "crates/kdj-library",
    "crates/kdj-server",
    "src-tauri",
]
exclude = ["vendor/rbox"]

[workspace.package]
version = "0.2.41"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Redress runs one 100-iteration NQP per STFT bin. Size optimisation leaves a single Deck too
# close to its realtime deadline on M2; optimise only this small Rust crate for throughput.
[profile.release.package.kdj-stems]
opt-level = 2

# tauri:dev 默认是 debug：波形/分析在未优化下单曲要几十秒，播放条会一直空着。
# `package."*"` 只覆盖 crates.io 依赖，不覆盖 workspace member——所以 kdj-analysis
# 必须单独开。业务 UI / 路由 crate 仍保持未优化，增量编译友好。
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.kdj-analysis]
opt-level = 2
[profile.dev.package.kdj-stems]
opt-level = 2
