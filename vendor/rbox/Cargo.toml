[package]
name = "rbox"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
authors = ["Dylan Jones <dylanljones@proton.me>"]
description = "Rust library for interacting with the local and export data of Pioneers Rekordbox DJ software"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dylanljones/rbox"

[lib]
name = "rbox"
path = "src/lib.rs"

[features]
default = ["one-library", "bundled-vendored-openssl"]
one-library = ["dep:diesel", "dep:diesel_migrations", "dep:libsqlite3-sys"]
bundled = ["libsqlite3-sys/bundled-sqlcipher"]
bundled-vendored-openssl = ["libsqlite3-sys/bundled-sqlcipher-vendored-openssl"]
# Kept as declared no-op flags so rustc's check-cfg recognizes upstream's disabled cfg_attrs.
anlz = []
master-db = []
napi = []
pyo3 = []
settings = []
xml = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3", features = ["sqlite", "r2d2", "128-column-tables", "returning_clauses_for_sqlite_3_35"], optional = true }
diesel_migrations = { version = "2.3", features = ["sqlite"], optional = true }
libsqlite3-sys = { version = "0.33", features = ["sqlcipher"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
thiserror = "2.0"
