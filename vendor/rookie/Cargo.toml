[package]
edition = "2021"
name = "rookie"
version = "0.5.6"
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Load cookie from your web browsers"
homepage = "https://crates.io/crates/rookie"
documentation = "https://docs.rs/rookie/"
readme = "README.md"
keywords = [
    "windows",
    "cookies",
    "rust",
    "web",
]
license-file = "MIT-LICENSE.txt"
repository = "https://github.com/thewh1teagle/rookie"

[lib]
name = "rookie"
path = "src/lib.rs"

[dependencies.aes]
version = "0.8"

[dependencies.aes-gcm]
