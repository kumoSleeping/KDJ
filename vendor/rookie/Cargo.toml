version = "0.11"

[dependencies.once_cell]
version = "1.20.2"

[dependencies.rand]
version = "0.8.5"

[dependencies.regex]
version = "1"

# KDJ already links libsqlite3-sys 0.33 through rusqlite 0.35 / SQLCipher.
# Keep one native sqlite provider; SQLCipher can read the browsers' plain SQLite DBs.
[dependencies.rusqlite]
version = "0.35"

[dependencies.rust-ini]
version = "0.21"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
